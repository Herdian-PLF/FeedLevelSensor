# Geometria fisica dos silos usados no simulador.
#
# Convencao global de coordenadas:
#
#   y = 0  ->  interface entre a tremonha e o corpo cilindrico
#
#   corpo cilindrico:  0 <= y <= cylinder_height_m
#   teto:              cylinder_height_m <= y <= cylinder_height_m + roof_height_m
#   tremonha:          -hopper_height_m <= y <= 0
#   saida / vao:       -(hopper_height_m + outlet_height_m) <= y <= -hopper_height_m
#
#   roof_top_y_m = cylinder_height_m + roof_height_m
#   bottom_y_m   = -(hopper_height_m + outlet_height_m)
#
#   roof_top_y_m - bottom_y_m = total_height_m   (validado ao carregar cada silo)
#
# ---------------------------------------------------------------------------
# CORTE DO TOPO (boca da tampa)
# ---------------------------------------------------------------------------
# Nenhum silo termina em apice fechado: todos tem um furo no topo para a
# tampa / escotilha. O cone do chapeu e portanto um TRONCO de cone, cortado
# em roof_top_radius_m.
#
# roof_height_reference diz a que ponto a cota roof_height_m se refere:
#
#   apex     -> cota do APICE do cone cheio (r = 0).
#               Confirmado pelos angulos exatos do catalogo CASP:
#               teto = 40.00 graus e tremonha = 60.00 graus
#               (o "-60" do nome do modelo e o angulo da tremonha).
#               A boca da tampa fica ABAIXO dessa cota, em
#               cylinder_height_m + (1 - roof_cut_fraction) * roof_height_m.
#               Acima da boca fica a tampa / colarinho, que completa a
#               total_height_m do catalogo.
#
#   opening  -> cota da propria BOCA da tampa (topo do tronco de cone).
#               E o caso do Mombuca, medido em campo junto com o
#               roof_top_radius_m.
#
# roof_cut_fraction e a fracao do cone removida no topo. Como o corte de um
# cone e auto-semelhante, a mesma fracao vale para o raio e para a altura.
#
#   roof_top_radius_m = roof_cut_fraction * radius_m
#
# Para o Mombuca a fracao e DERIVADA da medida real (0.305 / 1.150 = 0.2652):
# o chapeu tem 0.61 m de diametro no topo, medido em campo.
#
# Para os CASP nao temos a medida do furo, entao adotamos 0.10 como premissa:
# um corte pequeno, so o necessario para o furo da tampa.
#
# O sensor nunca pode passar da boca da tampa: o teto fisico que limita a
# pose e o plano da boca, nao o apice. Acima da boca nada e modelado nem
# desenhado - a geometria util termina no corte.

reference_density_t_per_m3: 0.64

