[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_extra_dirs = vendor
lib_ldf_mode = deep+
build_flags =
    -Wall -Wextra
    -I include
    -DENDPOINT_ID=${sysenv.ENDPOINT_ID}

[env:endpoint_bench]
build_src_filter = +<endpoint/>
build_flags = ${env.build_flags} -DBENCH_TIMING -DLOG_LEVEL=4

[env:endpoint_field]
build_src_filter = +<endpoint/>
build_flags = ${env.build_flags} -DLOG_LEVEL=2

; Test fixture, not the product gateway: it answers the endpoint so the session
; can be exercised, and nothing more.
[env:bench_gateway]
build_src_filter = +<bench_gateway/>
build_flags = ${env.build_flags} -DBENCH_TIMING -DLOG_LEVEL=4

; Phase 1 bench measurements: the radio's real per-packet limit and whether the
; RTC counter survives deep sleep. Both are assumptions the schedule rests on.
[env:probe]
build_src_filter = +<probe/>
build_flags = ${env.build_flags} -DBENCH_TIMING -DLOG_LEVEL=4
